<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chatbot Builder</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- THEME_SCRIPT from @acb/ui, before first paint so a dark choice never flashes light. A test keeps it in sync. -->
    <script>try{document.documentElement.setAttribute('data-acb-theme',localStorage.getItem('acb-theme')==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-acb-theme','light')}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
